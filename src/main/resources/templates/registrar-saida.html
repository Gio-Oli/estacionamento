<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Fácil - Registrar Saída</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        .panel-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            gap: 20px;
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitulo {
            color: #4a5568;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Área dos botões */
        .actions-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #43a047;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Botão secundário / outline */
        .btn-secondary {
            background-color: #ffffff;
            color: #4caf50;
            border: 2px solid #4caf50;
        }

        .btn-secondary:hover {
            background-color: #f0f7f4;
        }

        /* Botão de saída na tabela */
        .btn-exit {
            padding: 6px 14px;
            font-size: 0.85rem;
            background-color: #d32f2f;
        }

        .btn-exit:hover {
            background-color: #c62828;
        }

        /* Tabela */
        .table-container {
            width: 100%;
            border: 1.5px solid #c8e6c9;
            border-radius: 8px;
            overflow: hidden;
        }

        .table-header {
            background-color: #fafdfa;
            padding: 15px;
            border-bottom: 1.5px solid #c8e6c9;
            color: #2e7d32;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th {
            background-color: #f0f7f4;
            color: #2e7d32;
            text-align: left;
            padding: 12px 15px;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>

<body>

<div class="panel-container">

    <h2>Estação Fácil</h2>
    <p class="subtitulo">Clique em "Saída" no veículo correspondente.</p>

    <!-- Botões de Ação Superior -->
    <div class="actions-area">
        <a th:href="@{/painel}" class="btn btn-secondary">Voltar ao Painel</a>
        <a th:href="@{/veiculo/registrar-entrada}" class="btn">Registrar Entrada</a>
    </div>

    <!-- Tabela de Veículos -->
    <div class="table-container">

        <div class="table-header">
            Selecione o Veículo para Registrar a Saída
        </div>

        <table>
            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Hora de Entrada</th>
                <th>Ação</th>
            </tr>
            </thead>

            <tbody>
            <!-- Linha iterada com Thymeleaf -->
            <tr th:each="veiculo : ${veiculos}">
                <td th:text="${veiculo.placa}">ABC-1234</td>
                <td th:text="${veiculo.modelo}">Fiat Uno</td>
                <td th:text="${#temporals.format(veiculo.horaEntrada, 'dd/MM/yyyy HH:mm')}">08:30</td>
                <td>
                    <!-- Formulário individual para cada linha/veículo -->
                    <form th:action="@{/veiculo/saida/{id}(id=${veiculo.id})}"
                          method="post"
                          onsubmit="return confirm('Deseja realmente confirmar a saída deste veículo?');">
                        <button type="submit" class="btn btn-exit">Saída</button>
                    </form>
                </td>
            </tr>

            <!-- Mensagem caso não haja veículos -->
            <tr th:if="${#lists.isEmpty(veiculos)}">
                <td colspan="4" style="text-align: center; padding: 20px;">Nenhum veículo estacionado no momento.</td>
            </tr>
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
