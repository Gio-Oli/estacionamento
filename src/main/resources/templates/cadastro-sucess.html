<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Realizado - Estação Fácil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .icone-sucesso {
            font-size: 3rem;
            color: #4caf50;
            margin-bottom: 12px;
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 1.6rem;
        }

        p {
            color: #4a5568;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .acoes {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: inline-block;
        }

        .btn-primary {
            background-color: #4caf50;
            color: white;
            border: 2px solid #4caf50;
        }

        .btn-primary:hover {
            background-color: #43a047;
            border-color: #43a047;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #4caf50;
            border: 2px solid #4caf50;
        }

        .btn-secondary:hover {
            background-color: #f0f7f4;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icone-sucesso">✔</div>
    <h2>Cadastro Realizado!</h2>
    <p>A entrada do veículo foi registrada com sucesso no sistema.</p>

    <div class="acoes">
        <a href="/veiculo/cadastrar" class="btn btn-primary">Cadastrar outro veículo</a>
        <a href="/painel" class="btn btn-secondary">Voltar ao painel</a>
    </div>
</div>

</body>
</html>
