<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estação Fácil - Painel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        .panel-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            gap: 20px;
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 1.8rem;
            text-align: center;
        }

        /* Área dos botões */
        .actions-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #43a047;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Botão de saída */
        .btn-secondary {
            background-color: #ffffff;
            color: #4caf50;
            border: 2px solid #4caf50;
        }

        .btn-secondary:hover {
            background-color: #f0f7f4;
        }

        /* Tabela */
        .table-container {
            width: 100%;
            border: 1.5px solid #c8e6c9;
            border-radius: 8px;
            overflow: hidden;
        }

        .table-header {
            background-color: #fafdfa;
            padding: 15px;
            border-bottom: 1.5px solid #c8e6c9;
            color: #2e7d32;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th {
            background-color: #f0f7f4;
            color: #2e7d32;
            text-align: left;
            padding: 12px 15px;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Status */
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* Estatísticas */
        .stats-footer {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 10px;
        }

        .stat-box {
            flex: 1;
            background-color: #fafdfa;
            border: 1.5px solid #c8e6c9;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #2e7d32;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box span {
            display: block;
            font-size: 1.2rem;
            color: #2d3748;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="panel-container">

    <h2>Estação Fácil</h2>

    <!-- Botões de Ação -->
    <div class="actions-area">

        <!-- REGISTRAR ENTRADA -->
        <a th:href="@{/veiculo/registrar-entrada}"
           class="btn">
            Registrar Entrada
        </a>

        <!-- REGISTRAR SAÍDA -->
        <a th:href="@{/veiculo/registrar-saida}"
           class="btn btn-secondary">
            Registrar Saída
        </a>

    </div>


    <!-- Tabela de Veículos -->
    <div class="table-container">

        <div class="table-header">
            Veículos no Estacionamento
        </div>

        <table>

            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Hora de Entrada</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <!-- Veículos cadastrados -->
            <tr th:each="veiculo : ${veiculos}">

                <td th:text="${veiculo.placa}">
                    ABC-1234
                </td>

                <td th:text="${veiculo.modelo}">
                    Fiat Uno
                </td>

                <td th:text="${#temporals.format(veiculo.horaEntrada, 'dd/MM/yyyy HH:mm')}">
                    08:30
                </td>

                <td>
                    <span class="status-badge status-active">
                        Ativo
                    </span>
                </td>

            </tr>

            <!-- Linhas vazias -->
            <tr>
                <td>&nbsp;</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>

            </tbody>

        </table>
    </div>


    <!-- Rodapé com Estatísticas -->
    <div class="stats-footer">

        <div class="stat-box">
            Vagas Ocupadas
            <span th:text="${vagasOcupadas}">
                0
            </span>
        </div>

        <div class="stat-box">
            Vagas Disponíveis
            <span th:text="${vagasDisponiveis}">
                0
            </span>
        </div>

        <div class="stat-box">
            Total de Vagas
            <span th:text="${totalVagas}">
                50
            </span>
        </div>

    </div>

</div>

</body>
</html>
