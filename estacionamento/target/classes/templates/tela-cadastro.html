<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        form {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }

        h2 {
            color: #2e7d32;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 1.8rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1.5px solid #c8e6c9;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafdfa;
            color: #2d3748;
        }

        input:focus {
            border-color: #4caf50;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        input::placeholder {
            color: #a0aec0;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        button:hover {
            background-color: #43a047;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<form method="post" action="/efetuar-cadastro">
    <h2>Cadastro</h2>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
    <input type="email" id="email" name="email" placeholder="Adicione um e-mail" required>
    <input type="password" id="senha" name="senha" placeholder="Adicione uma senha" required>
    <input type="text" id="telefone" name="telefone" placeholder="Digite um número de telefone" required>
    <input type="date" id="nascimento" name="nascimento" placeholder="Digite a sua data de nascimento" required>
    <button>Cadastrar</button>
</form>
</body>
</html>
