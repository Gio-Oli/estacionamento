<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Entrada - Estação Fácil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
            padding: 20px;
        }

        form {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #2e7d32;
            font-weight: 600;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitulo {
            color: #4a5568;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            color: #2e7d32;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 18px;
            border: 1.5px solid #c8e6c9;
            border-radius: 8px;
            background-color: #fafdfa;
            color: #2d3748;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input::placeholder, textarea::placeholder {
            color: #a0aec0;
        }

        input:focus, textarea:focus {
            border-color: #4caf50;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        /* Placa sempre em maiúsculas */
        #placa {
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:focus-visible {
            outline: 3px solid rgba(76, 175, 80, 0.4);
            outline-offset: 2px;
        }

        .btn-primary {
            background-color: #4caf50;
            color: #ffffff;
            border: 2px solid #4caf50;
        }

        .btn-primary:hover {
            background-color: #43a047;
            border-color: #43a047;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #4caf50;
            border: 2px solid #4caf50;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background-color: #f0f7f4;
        }
    </style>
</head>
<body>
<form method="post" action="/veiculo/cadastrar">
    <h2>Registrar Entrada</h2>
    <p class="subtitulo">Informe os dados do veículo que está entrando.</p>

    <label for="placa">Placa</label>
    <input type="text" id="placa" name="placa" placeholder="ABC-1234" maxlength="8" required>

    <label for="modelo">Modelo</label>
    <input type="text" id="modelo" name="modelo" placeholder="Ex.: Fiat Uno" required>

    <label for="cor">Cor</label>
    <input type="text" id="cor" name="cor" placeholder="Ex.: Prata" required>

    <label for="observacao">Observações</label>
    <textarea id="observacao" name="observacao" placeholder="Opcional"></textarea>

    <button type="submit" class="btn btn-primary">Salvar entrada</button>
    <a href="/painel" class="btn btn-secondary">Voltar ao painel</a>
</form>
</body>
</html>
